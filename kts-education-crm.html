<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#12233f">
  <title>KTS Education Center CRM</title>
  <script>document.documentElement.classList.add('crm-auth-pending')</script><style>.crm-auth-pending body{visibility:hidden}.sidebar-foot .logout-button{width:100%;margin-top:12px;padding:9px;border:1px solid #354967;border-radius:8px;background:transparent;color:#e9f1ff;font-weight:700;text-align:left}</style>
  <link rel="icon" type="image/svg+xml" href="favicon-education.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="kts-education-crm.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="kts education center.html"><img src="KTS EDUCENTER LOGO.png" alt=""><span>KTS Education Center<small>ADMISSIONS CRM</small></span></a>
      <nav id="crmNav" aria-label="CRM navigation">
        <button class="active" data-view="dashboard"><span>⌂</span> Dashboard</button>
        <button data-view="enquiries"><span>◎</span> Enquiries <b id="leadBadge">0</b></button>
        <button data-view="students"><span>♙</span> Students</button>
        <button data-view="fees"><span>₹</span> Fee tracking</button>
        <button data-view="followups"><span>✓</span> Follow-ups</button>
      </nav>
      <div class="sidebar-foot"><p>Education CRM workspace</p><small>Records synchronize with KTS Firestore.</small><a href="kts-enterprise-operations.html">← Enterprise operations</a><button class="logout-button" id="crmLogout" type="button">Sign out</button></div>
    </aside>
    <button class="backdrop" id="backdrop" aria-label="Close menu"></button>
    <main>
      <header class="topbar">
        <button class="menu-button" id="menuButton" aria-label="Open menu" aria-expanded="false">☰</button>
        <div><small>KTS Education Center</small><strong id="pageTitle">Dashboard</strong></div>
        <label class="global-search"><span>⌕</span><input id="globalSearch" placeholder="Search name, phone or course" aria-label="Search records"></label>
        <button class="primary" id="quickAdd">＋ Add enquiry</button>
        <div class="profile"><span id="staffInitials">KS</span><div><b id="staffName">KTS Staff</b><small id="staffRole">Verifying access…</small></div></div>
      </header>
      <div class="content" id="content"></div>
    </main>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRoot" aria-live="polite"></div>
  <script type="module" src="education-crm-guard.js?v=20261010-2"></script>
  <script type="module" src="kts-education-crm.js?v=20261010-2"></script>
</body>
</html>
