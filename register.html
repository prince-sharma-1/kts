<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enroll Now | KTS Academy</title><link rel="icon" type="image/svg+xml" href="favicon-academy.svg">
    <link rel="stylesheet" href="kts style.css"> <style>
        .enroll-container { max-width: 500px; margin: 50px auto; padding: 20px; background: #1a1a1a; color: white; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: 1px solid #333; background: #000; color: #fff; }
        .btn-submit { width: 100%; padding: 12px; background: #00a8ff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-submit:hover { background: #0086cc; }
    </style>
</head>
<body>

<div class="enroll-container">
    <h2>Student Enrollment 2026-27</h2>
    <p>Request enrollment guidance. KTS will contact you to confirm availability and next steps.</p>
    <hr>
    <form id="enrollForm" onsubmit="return false">
        <div class="form-group">
            <label for="studentName">Full Name</label>
            <input type="text" id="studentName" name="name" minlength="2" maxlength="100" placeholder="Enter your name" required>
        </div>
        <div class="form-group">
            <label for="studentPhone">Phone Number</label>
            <input type="tel" id="studentPhone" name="phone" pattern="[+0-9\(\) \-]{8,18}" maxlength="18" placeholder="Enter mobile number" required>
        </div>
        <div class="form-group">
            <label for="course">Target Course</label>
            <select id="course" name="course">
                <option value="NEET Power Batch">NEET Power Batch</option>
                <option value="JEE Velocity Batch">JEE Velocity Batch</option>
            </select>
        </div>
        <button type="submit" class="btn-submit">Request Enrollment</button>
    </form>
    <div id="status"></div>
</div>

<script type="module" src="enquiry-forms.js"></script>

</body>
</html>
