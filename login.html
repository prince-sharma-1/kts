<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | KTS Academy</title>
  <meta name="description" content="Login to KTS Academy to access course purchases and student resources." />
  <link rel="stylesheet" href="kts style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    .modal-overlay { position:fixed; inset:0; background:rgba(15,23,42,0.9); display:flex; align-items:center; justify-content:center; padding:1rem; z-index:100; }
    .modal { width:100%; max-width:420px; background:var(--card); border:1px solid var(--border); border-radius:18px; padding:2rem; box-shadow:0 24px 60px rgba(0,0,0,0.35); position:relative; }
    .modal h2 { margin-top:0; color:#38bdf8; text-align:center; }
    .modal p { color:var(--muted); margin-bottom:1.5rem; text-align:center; }
    .form-group { margin-bottom:1rem; display:flex; flex-direction:column; gap:0.5rem; }
    .form-group label { color:#cbd5e1; font-weight:600; }
    .form-group input { width:100%; padding:0.95rem 1rem; border-radius:12px; border:1px solid #334155; background:#0f172a; color:#f8fafc; }
    .form-group input:focus { outline:none; border-color:#38bdf8; }
    .btn { display:inline-flex; justify-content:center; align-items:center; width:100%; padding:1rem; border:none; border-radius:12px; background:linear-gradient(135deg,#38bdf8,#22c55e); color:#001427; font-weight:700; cursor:pointer; }
    .btn:hover { opacity:0.95; }
    .close-btn { position:absolute; top:1rem; right:1rem; background:transparent; border:none; color:#cbd5e1; font-size:1.7rem; cursor:pointer; }
    .message { margin-top:1rem; text-align:center; color:#fde68a; }
    .modal-footer { margin-top:1.5rem; color:var(--muted); font-size:0.95rem; text-align:center; }
    @media(max-width:600px){ .modal { padding:1.5rem; } }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <div class="logo-container">
        <img src="kts_slogo.png" alt="KTS Academy Logo" class="logo" />
      </div>
      <div class="brand"><h2>KTS Academy</h2></div>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="kts education center.html">Courses</a></li>
          <li><a href="buy_course.html" class="cta">Buy Course</a></li>
        </ul>
      </nav>
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top:2rem;">
    <section class="hero">
      <h1>Login to access your course purchase</h1>
      <p>Use your email and password to sign in. If you are not registered yet, contact support to create an account.</p>
    </section>

    <div class="modal-overlay" id="loginOverlay">
      <div class="modal">
        <button class="close-btn" id="closeModal">&times;</button>
        <h2>Sign In</h2>
        <p>Enter your credentials to continue.</p>
        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter your password" required />
          </div>
          <button type="submit" class="btn">Sign In</button>
        </form>
        <p id="loginMessage" class="message"></p>
        <p class="modal-footer">Need help? Call <a href="tel:+917983910795" style="color:#38bdf8;">+91 79839 10795</a></p>
      </div>
    </div>
  </main>

  <script type="module">
    import { auth } from './firebase.js';
    import { signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    const overlay = document.getElementById('loginOverlay');
    const closeModal = document.getElementById('closeModal');
    const loginForm = document.getElementById('loginForm');
    const loginMessage = document.getElementById('loginMessage');

    function showMessage(message, color = '#fde68a') {
      loginMessage.textContent = message;
      loginMessage.style.color = color;
    }

    closeModal.addEventListener('click', () => {
      overlay.style.display = 'none';
    });

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      loginMessage.textContent = '';

      try {
        await signInWithEmailAndPassword(auth, email, password);
        showMessage('Login successful! Redirecting...', '#22c55e');
        setTimeout(() => {
          window.location.href = 'buy_course.html';
        }, 900);
      } catch (error) {
        showMessage(error.message || 'Login failed. Please check your credentials.', '#f87171');
      }
    });

    window.addEventListener('load', () => {
      overlay.style.display = 'flex';
    });
  </script>
</body>
</html>
