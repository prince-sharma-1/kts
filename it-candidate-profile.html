<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><title>Candidate Profile | KTS IT Solutions</title><link rel="icon" href="favicon-it.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="it-candidate-profile.css"></head><body><header><div class="wrap nav"><a class="brand" href="kts_it_home.html"><span>KTS</span><b>KTS IT Solutions<small>CANDIDATE NETWORK</small></b></a><div><a href="kts_it_home.html">Home</a><button id="logout" type="button">Sign out</button></div></div></header><main class="wrap"><section class="intro"><span>YOUR TALENT PROFILE</span><h1>Help us match you with the right technology opportunity.</h1><p>Complete your skills, experience, preferences and résumé. You can return and update your profile at any time.</p></section><form id="profileForm"><div class="form-head"><div><h2>Professional profile</h2><p id="accountEmail">Verifying your account…</p></div><strong id="completion">0% complete</strong></div><div class="grid"><label>Full name<input name="name" autocomplete="name" required maxlength="100"></label><label>Phone number<input name="phone" type="tel" autocomplete="tel" required maxlength="18"></label><label>Primary role<input name="headline" required maxlength="100" placeholder="e.g. Java Developer"></label><label>Experience<select name="experience" required><option value="">Select experience</option><option>Fresher</option><option>1–2 years</option><option>3–5 years</option><option>6–9 years</option><option>10+ years</option></select></label><label class="wide">Core skills<input name="skills" required maxlength="300" placeholder="Java, Spring Boot, SQL, AWS"></label><label>Current city<input name="city" required maxlength="80"></label><label>Preferred work model<select name="workModel" required><option value="">Select preference</option><option>Onsite</option><option>Hybrid</option><option>Remote</option><option>Flexible</option></select></label><label>Current/last company<input name="company" maxlength="120"></label><label>Notice period<select name="notice"><option>Immediate</option><option>15 days</option><option>30 days</option><option>60 days</option><option>90 days</option></select></label><label>LinkedIn URL<input name="linkedin" type="url" placeholder="https://linkedin.com/in/..."></label><label>Portfolio/GitHub URL<input name="portfolio" type="url" placeholder="https://github.com/..."></label><label class="wide">Professional summary<textarea name="summary" maxlength="1000" rows="5" placeholder="Describe your recent work, strengths and the opportunity you want next."></textarea></label><label class="wide resume">Résumé (PDF, DOC or DOCX; maximum 5 MB)<input id="resume" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"><small id="resumeStatus">No résumé uploaded yet.</small></label><label class="wide consent"><input name="consent" type="checkbox" required> I consent to KTS IT Solutions storing this information and contacting me about suitable opportunities.</label></div><div class="actions"><span id="status" role="status"></span><button id="saveButton" type="submit">Save candidate profile →</button></div></form></main><script type="module" src="it-candidate-profile.js"></script></body></html>
