<!DOCTYPE html>
<html lang="en" data-venture="scorehigh">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Take Test | Score High</title>
  <script type="module" src="auth-guard.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>:root{--navy:#07182d;--blue:#1769e0;--ink:#15253a;--muted:#718097;--line:#e5ecf4;--bg:#f5f8fc;--green:#159b70}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",sans-serif}.top{height:67px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center}.top>div,main{width:min(1080px,calc(100% - 32px));margin:auto}.top>div{display:flex;align-items:center;justify-content:space-between}.brand{font:800 19px "Plus Jakarta Sans";display:flex;align-items:center;gap:9px}.mark{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:#fff;background:linear-gradient(135deg,#2a7cf1,#114ba6)}.timer{font-weight:800;color:#1359bd;background:#edf5ff;border-radius:8px;padding:9px 12px;font-size:13px}main{padding:30px 0}.meta{display:flex;justify-content:space-between;align-items:end;margin-bottom:19px}.meta h1{font:800 23px "Plus Jakarta Sans";letter-spacing:-.8px;margin:0}.meta p{margin:6px 0 0;color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:1fr 210px;gap:20px}.card{background:#fff;border:1px solid var(--line);border-radius:15px}.question{padding:27px}.counter{font-weight:700;color:#1769e0;font-size:12px;text-transform:uppercase;letter-spacing:.7px}.question h2{font:700 18px/1.6 "Plus Jakarta Sans";white-space:pre-line;margin:14px 0 24px}.options{display:grid;gap:10px}.option{border:1px solid var(--line);border-radius:9px;padding:13px 15px;background:#fff;text-align:left;color:#33445c;font-size:14px;cursor:pointer}.option:hover,.option.selected{border-color:#78aaf1;background:#eff6ff;color:#1559bd}.controls{display:flex;justify-content:space-between;margin-top:26px}.btn{border:0;border-radius:8px;padding:10px 15px;font-weight:700;font-size:13px;cursor:pointer}.secondary{color:#53647c;background:#f0f4f8}.primary{color:#fff;background:var(--blue)}.palette{padding:19px}.palette h3{font:700 14px "Plus Jakarta Sans";margin:0 0 13px}.numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.number{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 0;color:#617088;font-size:11px;font-weight:700;cursor:pointer}.number.answered{border-color:#c6e9d9;background:#e9f8f0;color:#11825d}.submit{width:100%;margin-top:20px;background:#eaf3ff;color:#1459ba}.result{padding:45px 25px;text-align:center}.result h2{font:800 29px "Plus Jakarta Sans";letter-spacing:-1px}.score{font:800 51px "Plus Jakarta Sans";color:var(--blue);margin:14px 0}.result p{color:var(--muted)}@media(max-width:720px){.layout{grid-template-columns:1fr}.palette{order:-1}.numbers{grid-template-columns:repeat(10,1fr)}.meta{align-items:start}.timer{margin-left:12px}.question{padding:20px}.question h2{font-size:16px}}</style>
</head>
<body><header class="top"><div><a class="brand" href="Score High.html"><span class="mark">S</span>Score High</a><span class="timer" id="timer">60:00</span></div></header><main id="app"><p>Loading test…</p></main>
<script>
  const app=document.getElementById('app');let test,answers=[],current=0,seconds=3600,clock;
  const escapeHtml=value=>String(value).replace(/[&<>"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]));
  async function start(){const source=new URLSearchParams(location.search).get('src')||'files/bank-po-score-high.json';try{test=await fetch(source).then(response=>{if(!response.ok)throw Error();return response.json()});answers=Array(test.questions.length).fill(null);seconds=(test.durationMinutes||60)*60;render();clock=setInterval(()=>{seconds--;document.getElementById('timer').textContent=`${String(Math.max(0,Math.floor(seconds/60))).padStart(2,'0')}:${String(Math.max(0,seconds%60)).padStart(2,'0')}`;if(seconds<=0)submit()},1000)}catch{app.innerHTML='<div class="card result"><h2>Test unavailable</h2><p>Please return to the portal and try again.</p></div>'}}
  function render(){const q=test.questions[current];app.innerHTML=`<div class="meta"><div><h1>${escapeHtml(test.title)}</h1><p>${test.questionCount} questions · ${test.totalMarks} marks · English Language</p></div></div><div class="layout"><section class="card question"><span class="counter">Question ${current+1} of ${test.questions.length}</span><h2>${escapeHtml(q.question)}</h2><div class="options">${q.options.map((option,index)=>`<button class="option ${answers[current]===index?'selected':''}" data-option="${index}">${escapeHtml(option)}</button>`).join('')}</div><div class="controls"><button class="btn secondary" id="previous" ${current===0?'disabled':''}>← Previous</button><button class="btn primary" id="next">${current===test.questions.length-1?'Review answers':'Save & next →'}</button></div></section><aside class="card palette"><h3>Question palette</h3><div class="numbers">${test.questions.map((_,index)=>`<button class="number ${answers[index]!==null?'answered':''}" data-question="${index}">${index+1}</button>`).join('')}</div><button class="btn submit" id="submit">Submit test</button></aside></div>`;document.querySelectorAll('[data-option]').forEach(button=>button.onclick=()=>{answers[current]=Number(button.dataset.option);render()});document.querySelectorAll('[data-question]').forEach(button=>button.onclick=()=>{current=Number(button.dataset.question);render()});document.getElementById('previous').onclick=()=>{current--;render()};document.getElementById('next').onclick=()=>{if(current<test.questions.length-1){current++;render()}else document.getElementById('submit').scrollIntoView({behavior:'smooth'})};document.getElementById('submit').onclick=submit}
  function submit(){clearInterval(clock);const correct=test.questions.reduce((total,q,index)=>total+(answers[index]===q.answerIndex?1:0),0);const marks=test.questions.reduce((total,q,index)=>total+(answers[index]===q.answerIndex?q.marks:0),0);app.innerHTML=`<section class="card result"><p>Test submitted</p><h2>Great effort!</h2><div class="score">${marks} / ${test.totalMarks}</div><p>You answered ${correct} of ${test.questions.length} questions correctly.</p><p style="margin-top:22px"><a class="btn primary" href="Testseries.html">Back to portal</a></p></section>`}
  start();
</script></body></html>
