<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KTS Academy Login & Registration</title><link rel="stylesheet" href="venture-login.css"></head><body data-venture="academy" data-color="#f59e0b"><main class="portal"><section class="portal-brand"><a class="brand" data-home><span class="brand-mark" data-portal-mark></span><span data-portal-name></span></a><div class="welcome"><span class="eyebrow">Dedicated student portal</span><h1>Prepare with focus. Achieve with confidence.</h1><p>Secure access to your JEE and NEET courses, tests, mentoring, and enrollment journey.</p></div><p class="boundary"><strong>Separate venture access:</strong> <span data-audience></span></p></section><section class="form-panel"><div class="form-wrap"><a class="brand mobile-brand" data-home><span class="brand-mark" data-portal-mark></span><span data-portal-name></span></a><h2 id="formTitle">Welcome back</h2><p class="subtitle" id="formSubtitle">Sign in to your portal.</p><div class="tabs"><button class="tab active" data-target="signIn">Login</button><button class="tab" data-target="signUp">Register</button></div><form id="signIn" class="active"><div class="field"><label for="loginEmail">Email address</label><input id="loginEmail" type="email" autocomplete="email" required></div><div class="field"><div class="password-row"><label for="loginPassword">Password</label><button type="button" class="text-button" id="resetPassword">Forgot password?</button></div><input id="loginPassword" type="password" autocomplete="current-password" minlength="6" required></div><button class="submit" type="submit">Login →</button></form><form id="signUp"><div class="field"><label for="signupName">Full name</label><input id="signupName" autocomplete="name" required></div><div class="field"><label for="signupEmail">Email address</label><input id="signupEmail" type="email" autocomplete="email" required></div><div class="field"><label for="signupPassword">Create password</label><input id="signupPassword" type="password" autocomplete="new-password" minlength="6" required></div><button class="submit" type="submit">Register →</button></form><p class="message" id="message" role="status"></p><p class="switch-note">Need another KTS venture? Return to <a href="kts group.html#ventures">KTS Enterprise</a>.</p></div></section></main><script type="module" src="venture-login.js"></script></body></html>
